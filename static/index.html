<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --danger: #ef4444;
      --danger-bg: #fee2e2;
      --success: #22c55e;
      --success-bg: #dcfce7;
      --warning: #f59e0b;
      --warning-bg: #fef3c7;
      --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
      --shadow-lg: 0 10px 25px -5px rgba(0,0,0,.1), 0 8px 10px -6px rgba(0,0,0,.05);
      --radius: 14px;
    }
    [data-theme="dark"] {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #263449;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #334155;
      --primary: #818cf8;
      --primary-hover: #6366f1;
      --danger: #f87171;
      --danger-bg: #450a0a;
      --success: #4ade80;
      --success-bg: #052e16;
      --warning: #fbbf24;
      --warning-bg: #451a03;
      --shadow: 0 1px 3px rgba(0,0,0,.4);
      --shadow-lg: 0 10px 25px -5px rgba(0,0,0,.5);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background .3s, color .3s;
    }
    .container { max-width: 760px; margin: 0 auto; padding: 40px 20px 60px; }

    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
    .logo { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 700; letter-spacing: -.5px; }
    .logo-dot {
      width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
      background: linear-gradient(135deg, var(--primary), #a855f7);
      color: #fff; font-size: 17px;
      box-shadow: 0 4px 12px rgba(99,102,241,.4);
    }
    .theme-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      width: 40px; height: 40px; border-radius: 12px; cursor: pointer; font-size: 18px;
      transition: all .2s;
    }
    .theme-btn:hover { transform: scale(1.05); border-color: var(--primary); color: var(--text); }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
    .stat {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px 16px; box-shadow: var(--shadow); transition: transform .15s;
    }
    .stat:hover { transform: translateY(-2px); }
    .stat-num { font-size: 24px; font-weight: 700; }
    .stat-label { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .stat.accent .stat-num { color: var(--primary); }
    .stat.done .stat-num { color: var(--success); }

    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 22px; margin-bottom: 16px; transition: background .3s, border-color .3s;
    }

    input, select {
      padding: 11px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px;
      background: var(--surface-2); color: var(--text); transition: border-color .2s, box-shadow .2s;
    }
    input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,.15); }
    .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .filters select, .filters input { padding: 9px 12px; font-size: 13px; flex: 1; min-width: 130px; }
    .btn {
      padding: 9px 14px; border: 1px solid var(--border); border-radius: 10px; cursor: pointer;
      background: var(--surface); color: var(--text); font-size: 13px; font-weight: 600;
      transition: all .2s; white-space: nowrap;
    }
    .btn:hover { border-color: var(--primary); color: var(--primary); }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary-hover); color: #fff; }

    .list-header { display: flex; justify-content: space-between; align-items: center; margin: 22px 4px 10px; }
    .list-header h2 { font-size: 15px; font-weight: 700; }
    .list-header .count { font-size: 13px; color: var(--muted); }

    .chat-card { display: flex; flex-direction: column; }
    .chat-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .chat-header h2 { font-size: 15px; font-weight: 700; }
    .chat-badge {
      font-size: 11px; padding: 3px 10px; border-radius: 999px; font-weight: 600;
      background: linear-gradient(135deg, var(--primary), #8b5cf6); color: #fff;
    }
    .chat-window {
      height: 320px; overflow-y: auto; padding: 14px; border-radius: 12px;
      background: var(--surface-2); border: 1px solid var(--border); margin-bottom: 12px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .chat-msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.45; overflow-wrap: break-word; animation: slideIn .2s ease; }
    .chat-msg.user { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
    .chat-msg.bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; box-shadow: var(--shadow); }
    .chat-msg.typing { color: var(--muted); font-style: italic; }
    .chat-msg.approval {
      align-self: flex-start; max-width: 88%; background: var(--surface);
      border: 1px solid var(--warning); border-bottom-left-radius: 4px; box-shadow: var(--shadow);
    }
    .approval-title { font-weight: 700; font-size: 13.5px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .approval-tool {
      display: inline-block; font-size: 12px; font-weight: 600; text-transform: capitalize;
      background: var(--warning-bg); color: var(--warning); padding: 3px 10px; border-radius: 999px; margin-bottom: 8px;
    }
    .approval-args {
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px; font-size: 12px; overflow-x: auto; margin-bottom: 12px;
      font-family: 'SFMono-Regular', Consolas, monospace; white-space: pre-wrap; word-break: break-word;
    }
    .approval-btns { display: flex; gap: 8px; }
    .approval-btns button {
      flex: 1; padding: 10px; border: none; border-radius: 10px; cursor: pointer;
      font-size: 13.5px; font-weight: 600; color: #fff; transition: transform .15s;
    }
    .approval-btns button:hover { transform: translateY(-1px); }
    .approval-btns button:disabled { opacity: .6; cursor: not-allowed; transform: none; }
    .approve-btn { background: var(--success); }
    .reject-btn { background: var(--danger); }
    .approval-status { font-size: 13px; font-weight: 600; margin-top: 4px; }
    .approval-status.approved { color: var(--success); }
    .approval-status.rejected { color: var(--danger); }
    .chat-input-row { display: flex; gap: 10px; }
    .chat-input-row input { flex: 1; }
    .chat-input-row input:disabled { opacity: .6; cursor: not-allowed; }
    .chat-input-row button { padding: 11px 18px; border: none; border-radius: 10px; cursor: pointer; background: linear-gradient(135deg, var(--primary), #8b5cf6); color: #fff; font-weight: 600; transition: all .2s; }
    .chat-input-row button:hover { transform: translateY(-1px); }
    .chat-input-row button:disabled { opacity: .6; cursor: not-allowed; transform: none; }

    .suggestions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .suggestions .chip {
      padding: 7px 12px; font-size: 12.5px; border-radius: 999px; cursor: pointer;
      background: var(--surface-2); border: 1px solid var(--border); color: var(--muted);
      transition: all .2s;
    }
    .suggestions .chip:hover { border-color: var(--primary); color: var(--primary); }

    ul { list-style: none; }
    li {
      display: flex; align-items: center; gap: 14px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px;
      box-shadow: var(--shadow); animation: slideIn .25s ease; transition: border-color .2s, transform .15s;
    }
    li:hover { border-color: var(--primary); transform: translateX(2px); }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

    li.completed { opacity: .65; }
    li.completed .task-title { text-decoration: line-through; }

    .checkbox {
      width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--border); cursor: pointer;
      flex-shrink: 0; display: grid; place-items: center; font-size: 12px; color: #fff;
      transition: all .2s; background: transparent;
    }
    .checkbox:hover { border-color: var(--primary); }
    .checkbox.checked { background: var(--primary); border-color: var(--primary); }

    .task-info { flex: 1; min-width: 0; }
    .task-title { font-weight: 600; font-size: 14.5px; overflow-wrap: break-word; }
    .task-meta { font-size: 12.5px; color: var(--muted); margin-top: 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .task-desc { overflow-wrap: break-word; }
    .badge {
      font-size: 11px; padding: 3px 10px; border-radius: 999px; font-weight: 600; text-transform: capitalize;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .badge.high { background: var(--danger-bg); color: var(--danger); }
    .badge.medium { background: var(--warning-bg); color: var(--warning); }
    .badge.low { background: var(--success-bg); color: var(--success); }
    .assignee { display: inline-flex; align-items: center; gap: 4px; }
    .assignee::before { content: '👤'; font-size: 11px; }
    .task-time { font-size: 12px; color: var(--muted); }

    .del-btn {
      border: none; background: transparent; cursor: pointer; font-size: 16px; opacity: .5;
      width: 32px; height: 32px; border-radius: 8px; transition: all .2s; flex-shrink: 0;
    }
    .del-btn:hover { opacity: 1; background: var(--danger-bg); }

    .empty {
      text-align: center; color: var(--muted); padding: 40px 20px;
    }
    .empty-icon { font-size: 42px; margin-bottom: 10px; }
    .empty-title { font-weight: 600; color: var(--text); margin-bottom: 4px; }

    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--text); color: var(--bg); padding: 12px 22px; border-radius: 999px;
      font-size: 14px; font-weight: 500; box-shadow: var(--shadow-lg); opacity: 0;
      transition: all .3s ease; pointer-events: none; z-index: 100;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 560px) {
      .stats { grid-template-columns: 1fr; }
      .filters select, .filters input { flex: 1 1 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo"><div class="logo-dot">✓</div> TaskFlow</div>
      <button class="theme-btn" id="theme-btn" title="Toggle theme">🌙</button>
    </header>

    <div class="stats">
      <div class="stat accent"><div class="stat-num" id="stat-total">0</div><div class="stat-label">Total tasks</div></div>
      <div class="stat"><div class="stat-num" id="stat-pending">0</div><div class="stat-label">Pending</div></div>
      <div class="stat done"><div class="stat-num" id="stat-done">0</div><div class="stat-label">Completed</div></div>
    </div>

    <div class="card">
      <div class="filters">
        <select id="filter-priority">
          <option value="">All priorities</option>
          <option value="low">🟢 Low</option>
          <option value="medium">🟡 Medium</option>
          <option value="high">🔴 High</option>
        </select>
        <input id="filter-assigned" placeholder="Filter by assignee…" />
        <select id="filter-completed">
          <option value="">All statuses</option>
          <option value="false">Pending</option>
          <option value="true">Completed</option>
        </select>
        <button class="btn btn-primary" onclick="loadTasks()">Apply</button>
        <button class="btn" onclick="clearFilters()">Clear</button>
      </div>
    </div>

    <div class="card chat-card">
      <div class="chat-header">
        <h2>AI Assistant</h2>
        <span class="chat-badge">✨ Agent</span>
      </div>
      <div class="suggestions">
        <span class="chip" onclick="suggest('List all my tasks')">List tasks</span>
        <span class="chip" onclick="suggest('Create a high priority task to review PRs, assigned to me')">Create task</span>
        <span class="chip" onclick="suggest('Show me pending tasks')">Pending only</span>
      </div>
      <div class="chat-window" id="chat-window">
        <div class="chat-msg bot">Hi! I'm your task assistant. Ask me to create, update, list, or delete tasks. 🚀</div>
      </div>
      <div class="chat-input-row">
        <input id="chat-input" placeholder="Ask the agent to manage your tasks…" />
        <button id="chat-send" onclick="sendChat()">Send</button>
      </div>
    </div>

    <div class="list-header">
      <h2>Tasks</h2>
      <span class="count" id="visible-count"></span>
    </div>

    <ul id="task-list"></ul>
  </div>

  <div id="toast"></div>

  <script>
    const list = document.getElementById('task-list');
    let toastTimer;

    const api = async (path, method = 'GET', body = null) => {
      const opts = { method, headers: {} };
      if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
      const res = await fetch(path, opts);
      if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
      return res.status === 204 ? null : res.json();
    };

    const toast = (msg) => {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
    };

    async function loadTasks() {
      const params = new URLSearchParams();
      const p = document.getElementById('filter-priority').value;
      const a = document.getElementById('filter-assigned').value.trim();
      const c = document.getElementById('filter-completed').value;
      if (p) params.set('priority', p);
      if (a) params.set('assigned_to', a);
      if (c !== '') params.set('completed', c);
      try {
        const tasks = await api('/tasks/' + (params.toString() ? '?' + params.toString() : ''));
        render(tasks);
        updateStats(tasks);
        document.getElementById('visible-count').textContent = tasks.length + ' shown';
      } catch (e) {
        list.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-title">Failed to load</div>${e.message}</div>`;
      }
    }

    async function updateStats(visible) {
      try {
        const all = await api('/tasks/');
        const done = all.filter(t => t.completed).length;
        document.getElementById('stat-total').textContent = all.length;
        document.getElementById('stat-done').textContent = done;
        document.getElementById('stat-pending').textContent = all.length - done;
      } catch (e) {}
    }

    function render(tasks) {
      list.innerHTML = '';
      if (!tasks.length) {
        list.innerHTML = '<div class="empty"><div class="empty-icon">🗂️</div><div class="empty-title">No tasks here</div>Try adding one or adjusting your filters.</div>';
        return;
      }
      for (const t of tasks) {
        const li = document.createElement('li');
        if (t.completed) li.classList.add('completed');
        const meta = [
          `<span class="badge ${t.priority}">${priorityDot(t.priority)} ${t.priority}</span>`,
          t.assigned_to ? `<span class="assignee">${escapeHtml(t.assigned_to)}</span>` : null,
          `<span class="task-time">📅 ${formatDate(t.created_at)}</span>`,
        ].filter(Boolean).join('');
        const desc = t.description ? `<div class="task-desc">${escapeHtml(t.description)}</div>` : '';
        const edited = t.updated_at !== t.created_at ? ` · edited ${formatTime(t.updated_at)}` : '';
        li.innerHTML = `
          <div class="checkbox ${t.completed ? 'checked' : ''}" onclick="toggleTask(${t.id}, ${!t.completed})">${t.completed ? '✓' : ''}</div>
          <div class="task-info">
            <div class="task-title">${escapeHtml(t.title)}</div>
            ${desc}
            <div class="task-meta">${meta}<span class="task-time">${edited}</span></div>
          </div>
          <button class="del-btn" title="Delete" onclick="deleteTask(${t.id})">🗑</button>`;
        list.appendChild(li);
      }
    }

    function priorityDot(p) { return p === 'high' ? '🔴' : p === 'medium' ? '🟡' : '🟢'; }

    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }
    function formatTime(iso) {
      const d = new Date(iso);
      return d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
    }

    async function toggleTask(id, completed) {
      await api('/tasks/' + id, 'PUT', { completed });
      toast(completed ? 'Task completed 🎉' : 'Task reopened');
      loadTasks();
    }

    async function deleteTask(id) {
      if (!confirm('Delete this task?')) return;
      await api('/tasks/' + id, 'DELETE');
      toast('Task deleted');
      loadTasks();
    }

    const escapeHtml = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };

    function clearFilters() {
      document.getElementById('filter-priority').value = '';
      document.getElementById('filter-assigned').value = '';
      document.getElementById('filter-completed').value = '';
      loadTasks();
    }

    // AI Agent chat
    const AGENT_URL = document.getElementById('agent-url')?.value || window.location.origin.replace(':8000', ':8080');
    let pendingApproval = null;

    function addChatMsg(text, who) {
      const win = document.getElementById('chat-window');
      const div = document.createElement('div');
      div.className = 'chat-msg ' + who;
      div.textContent = text;
      win.appendChild(div);
      win.scrollTop = win.scrollHeight;
      return div;
    }

    function suggest(text) {
      document.getElementById('chat-input').value = text;
      sendChat();
    }

    function setChatInputDisabled(disabled) {
      document.getElementById('chat-input').disabled = disabled;
      document.getElementById('chat-send').disabled = disabled;
    }

    function fmtArgs(args) {
      try {
        const parsed = typeof args === 'string' ? JSON.parse(args) : args;
        return JSON.stringify(parsed, null, 2);
      } catch {
        return String(args);
      }
    }

    function addApprovalCard(approval) {
      const win = document.getElementById('chat-window');
      const card = document.createElement('div');
      card.className = 'chat-msg approval';
      card.innerHTML = `
        <div class="approval-title">🔐 Approval required</div>
        <div class="approval-tool">${escapeHtml(approval.tool || 'tool')}</div>
        <div class="approval-args">${escapeHtml(fmtArgs(approval.arguments))}</div>
        <div class="approval-btns">
          <button class="approve-btn" onclick="sendApproval(true)">✓ Approve</button>
          <button class="reject-btn" onclick="sendApproval(false)">✕ Reject</button>
        </div>`;
      win.appendChild(card);
      win.scrollTop = win.scrollHeight;
    }

    async function sendApproval(isApproved) {
      if (!pendingApproval) return;
      const cards = document.querySelectorAll('.chat-msg.approval');
      const card = cards[cards.length - 1];
      const btns = card.querySelector('.approval-btns');
      const btn = btns.querySelector('.approve-btn');
      btns.innerHTML = `<div class="approval-status ${isApproved ? 'approved' : 'rejected'}">${isApproved ? 'Approving…' : 'Rejecting…'}</div>`;
      btn.disabled = true;
      setChatInputDisabled(true);
      try {
        const res = await fetch(AGENT_URL + '/approve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ state: pendingApproval, is_approved: isApproved }),
        });
        if (!res.ok) throw new Error('Approval error ' + res.status);
        const data = await res.json();
        const status = card.querySelector('.approval-status');
        if (isApproved) {
          status.textContent = '✓ Approved';
          status.classList.add('approved');
        } else {
          status.textContent = '✕ Rejected';
          status.classList.add('rejected');
        }
        pendingApproval = null;
        if (data.approval) {
          addApprovalCard(data.approval);
        } else {
          addChatMsg(data.response || 'Done.', 'bot');
        }
        loadTasks();
      } catch (e) {
        const status = card.querySelector('.approval-status');
        status.textContent = '⚠️ ' + e.message;
      } finally {
        setChatInputDisabled(false);
        document.getElementById('chat-input').focus();
      }
    }

    async function sendChat() {
      const input = document.getElementById('chat-input');
      const msg = input.value.trim();
      if (!msg) return;
      input.value = '';
      addChatMsg(msg, 'user');
      const typing = addChatMsg('Thinking…', 'bot typing');
      setChatInputDisabled(true);
      try {
        const res = await fetch(AGENT_URL + '/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg }),
        });
        if (!res.ok) throw new Error('Agent error ' + res.status);
        const data = await res.json();
        typing.remove();
        if ((data.status === 'approval_required' || data.status === 'approvel required') && data.approval) {
          pendingApproval = data.state;
          addApprovalCard(data.approval);
          setChatInputDisabled(true);
          return;
        } else {
          addChatMsg(data.response, 'bot');
          loadTasks();
        }
      } catch (e) {
        typing.remove();
        addChatMsg('⚠️ ' + e.message, 'bot');
      } finally {
        if (!pendingApproval) {
          setChatInputDisabled(false);
          document.getElementById('chat-input').focus();
        }
      }
    }

    document.getElementById('chat-input').addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter') sendChat();
    });

    // Theme
    const themeBtn = document.getElementById('theme-btn');
    themeBtn.onclick = () => {
      const cur = document.documentElement.dataset.theme;
      const next = cur === 'light' ? 'dark' : 'light';
      document.documentElement.dataset.theme = next;
      themeBtn.textContent = next === 'dark' ? '☀️' : '🌙';
      localStorage.setItem('theme', next);
    };
    const saved = localStorage.getItem('theme');
    if (saved) {
      document.documentElement.dataset.theme = saved;
      themeBtn.textContent = saved === 'dark' ? '☀️' : '🌙';
    }

    loadTasks();
  </script>
</body>
</html>
